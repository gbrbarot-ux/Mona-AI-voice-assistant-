name: Build Mona APK Automatically
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          echo "Looking for project files..."
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              unzip -o "$z"
            done
          fi

          PROJ_DIR=$(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.git/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: settings file not found anywhere!"
            exit 1
          fi

          echo "Found correct root project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew

          # Robust Python Regex Script to safely inject xmlns:tools into AndroidManifest.xml
          python3 -c '
          import re
          path = "app/src/main/AndroidManifest.xml"
          try:
              with open(path, "r") as f:
                  content = f.read()
              if "xmlns:tools" not in content:
                  content = re.sub(r"<manifest\b", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"", content, count=1)
                  with open(path, "w") as f:
                      f.write(content)
                  print("Successfully injected xmlns:tools via regex into AndroidManifest.xml")
              else:
                  print("xmlns:tools already present")
          except Exception as e:
              print(f"Error modifying manifest: {e}")
          '

          echo "Building APK..."
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Mona-Voice-Assistant-APK
          path: '**/app/build/outputs/apk/debug/*.apk'

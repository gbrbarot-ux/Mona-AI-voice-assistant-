name: Build Mona APK Automatically
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          echo "Looking for project files..."
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              unzip -o "$z"
            done
          fi

          PROJ_DIR=$(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.git/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: settings file not found anywhere!"
            exit 1
          fi

          echo "Found correct root project directory at: $PROJ_DIR"
          cd "$PROJ_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew

          # Bulletproof Python Script to force-inject xmlns:tools directly into the <manifest> tag
          python3 -c '
          import re
          path = "app/src/main/AndroidManifest.xml"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Purana ya galat xmlns:tools hata rahe hain taaki duplicate na ho
              content = content.replace("xmlns:tools=\"http://schemas.android.com/tools\"", "")
              content = content.replace("xmlns:tools='\''http://schemas.android.com/tools'\''", "")
              
              # Seedha <manifest tag ke andar forcibly inject kar rahe hain
              content = re.sub(r"(<manifest\b)", r"\1 xmlns:tools=\"http://schemas.android.com/tools\"", content, count=1)
              
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Successfully force-injected xmlns:tools into <manifest> tag.")
          except Exception as e:
              print(f"Error updating manifest: {e}")
          '

          echo "Building APK..."
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Mona-Voice-Assistant-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
